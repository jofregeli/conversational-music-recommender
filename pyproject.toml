[project]
name = "recomendador"
version = "0.1.0"
description = "Conversational music recommender over MTG-Jamendo (text-audio embeddings, search and a tool-use agent)."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy>=2.0",
    "torch>=2.7",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.8",
    "jupyterlab>=4.0",
]

# Build backend so that `import recomendador` works from src/
[build-system]
requires = ["uv_build>=0.9,<0.14"]
build-backend = "uv_build"

# --- PyTorch with CUDA 12.8 (RTX 5080 = Blackwell, sm_120) ---
# Only torch comes from the PyTorch index; everything else from PyPI.
[tool.uv.sources]
torch = [{ index = "pytorch-cu128" }]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

# --- ruff: linter + formatter ---
[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# E/F: basic errors, I: import order, UP: modern Python syntax, B: likely bugs
select = ["E", "F", "I", "UP", "B"]

# --- pytest ---
[tool.pytest.ini_options]
testpaths = ["tests"]
